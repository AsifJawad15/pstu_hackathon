name: Compile Abstract PDF

on:
  pull_request:
    paths:
      - 'submission/Intelligent_Emergency_Response_Abstract_Highlighted.tex'
      - '.github/workflows/compile-abstract.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: submission/Intelligent_Emergency_Response_Abstract_Highlighted.tex

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp Intelligent_Emergency_Response_Abstract_Highlighted.pdf output/
          cp submission/Intelligent_Emergency_Response_Abstract_Highlighted.tex output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: highlighted-abstract
          path: output/
